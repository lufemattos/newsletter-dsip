<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organograma DS&IP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background:#f8f9fa; color:#111; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: .5rem; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  </style>
</head>

<body class="antialiased min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto bg-white shadow-xl overflow-hidden rounded-sm border border-gray-200">

    <!-- HEADER -->
    <header class="bg-black text-white p-6 flex justify-between items-center border-b-4 border-[#E97132]">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tighter uppercase">Organograma</h1>
        <p class="text-sm text-gray-300">
          DS<span class="text-[#E97132]">&</span>IP | Estrutura da Área
        </p>
      </div>

      <div class="flex gap-3">
        <button onclick="openFullscreen()"
          class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">
          Abrir em Tela Cheia
        </button>

        <a href="index.html"
          class="inline-flex items-center border border-[#E97132] text-[#E97132] px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-[#E97132] hover:text-white transition-colors">
          VOLTAR PARA JUST TRACK IT
        </a>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="p-6 md:p-8">

      <div class="card p-6">

        <div class="overflow-auto">
          <img id="organogramaImage"
               src="organograma.png"
               alt="Organograma DS&IP"
               class="w-full h-auto border border-gray-200 rounded shadow-sm">
        </div>

      </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-black text-white py-6 text-center border-t-4 border-[#E97132]">
      <p class="text-sm font-light text-gray-400">Newsletter Confidencial | Uso Interno</p>
      <p class="text-xs text-[#E97132] font-bold mt-1 tracking-widest">JUST DO IT.</p>
    </footer>

  </div>

<script>
function openFullscreen() {
  const elem = document.getElementById("organogramaImage");

  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) { /* Safari */
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) { /* IE11 */
    elem.msRequestFullscreen();
  }
}
</script>

</body>
</html>
