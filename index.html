<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter DS&IP | Just Track It</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #111; }
        .nike-orange { color: #E97132; }
        .bg-nike-orange { background-color: #E97132; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .season-tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; color: white; font-size: 10px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
    </style>
</head>
<body class="antialiased min-h-screen p-4 md:p-8">

    <div id="newsletter" class="max-w-6xl mx-auto bg-white shadow-xl overflow-hidden rounded-sm border border-gray-200">

        <div class="bg-black text-white p-6 flex justify-between items-center border-b-4 border-[#E97132]">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter uppercase">Checkpoint</h1>
                <h2 class="text-xl font-light text-gray-300 tracking-widest">DS<span class="text-[#E97132]">&</span>IP</h2>
            </div>
            <div class="text-right">
                <p class="text-sm font-bold text-gray-400 uppercase tracking-wider">Demand | Supply | Inventory</p>
                <p class="text-xs text-gray-500 mt-1">Updates Semanais</p>
            </div>
        </div>

        <section class="mb-8">
            <div class="bg-gray-900 text-white py-4 px-8 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-40 h-40 bg-[#E97132] opacity-5 rounded-full transform translate-x-10 -translate-y-10"></div>
                <div class="relative z-10 flex items-center justify-between gap-4 flex-wrap">
                    <h2 class="text-3xl font-black italic tracking-wide uppercase text-white">JUST TRACK IT!</h2>
                    <div class="flex gap-2 flex-wrap">
                        <a href="kpi.html" class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">KPIs</a>
                        <a href="code.html" class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">CODE</a>
                        <a href="organograma-dsip.png" class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">ORGANOGRAMA</a>
                    </div>
                </div>
            </div>

            <div class="p-8 bg-white border-b border-gray-100">
                <table class="w-full text-left border-collapse">
                    <tbody id="justTrackItBody" class="text-sm md:text-base text-gray-800 font-medium"></tbody>
                </table>
            </div>
        </section>

        <section class="py-10 bg-white border-t border-b border-gray-100 overflow-visible">
            <h3 class="text-center text-2xl font-extrabold uppercase mb-12 italic">SU27 – Calendário de Compras</h3>
            <div class="relative w-full px-4 overflow-visible pb-8">
                <div id="timelineLine" class="absolute top-1/2 left-0 h-1 bg-gray-200 transform -translate-y-1/2 z-0"></div>
                <div id="timelineViewport" class="relative z-10 px-4 h-48">
                    <div id="timelineContainer" class="flex justify-between items-center h-48" style="transform-origin: left center;"></div>
                </div>
            </div>
        </section>

        <section class="p-8 bg-gray-50 border-t border-gray-200">
          <h3 class="text-2xl font-black uppercase tracking-tight text-center mb-12">Dates & Gates</h3>
          <div id="datesGatesRoot" class="relative max-w-4xl mx-auto">
            <div id="datesGatesLine" class="absolute left-1/2 top-4 bottom-4 w-px bg-gray-300 transform -translate-x-1/2"></div>
            <div id="datesGatesContainer"></div>
          </div>
        </section>

        <footer class="bg-black text-white py-6 text-center border-t-4 border-[#E97132]">
            <p class="text-sm font-light text-gray-400">Newsletter Confidencial | Uso Interno</p>
            <p class="text-xs text-[#E97132] font-bold mt-1 tracking-widest uppercase">Just Do It.</p>
        </footer>
    </div>

    <script src="data.js"></script>
<script>
  (function () {
    if (!window.REPORT || !Array.isArray(REPORT.justTrackIt)) return;

    const tbody = document.getElementById("justTrackItBody");
    if (!tbody) return;

    tbody.innerHTML = REPORT.justTrackIt.map((it) => {
      if (it.accent) {
        return `
          <tr class="border-b border-gray-100 group hover:bg-gray-50 transition-colors">
            <td class="py-4 pl-4 border-l-4 border-[#E97132]">
              <span class="font-bold text-black block md:inline">${it.title || ""}</span> 
              <span class="text-gray-700">${it.text || ""}</span>
              ${it.check ? '<span class="ml-2 inline-flex items-center justify-center w-5 h-5 rounded-full bg-green-600 text-white text-xs font-bold">✓</span>' : ""}
            </td>
          </tr>
        `;
      }

      return `
        <tr class="border-b border-gray-100 group hover:bg-gray-50 transition-colors">
          <td class="py-4 pl-4 border-l-4 border-gray-200 group-hover:border-gray-400 transition-colors">
            <span class="font-bold text-black">${it.date || ""}</span> – ${it.text || ""}
            ${it.warn ? '<span class="text-lg ml-1">⚠️</span>' : ""}
          </td>
        </tr>
      `;
    }).join("");
  })();
</script>

<script>
(function () {
  if (!window.REPORT || !Array.isArray(REPORT.timeline)) return;

  const viewport = document.getElementById("timelineViewport");
  const container = document.getElementById("timelineContainer");
  const line = document.getElementById("timelineLine");

  if (!viewport || !container || !line) return;

  const SAFE_PADDING = 50; 

  viewport.style.paddingLeft = SAFE_PADDING + "px";
  viewport.style.paddingRight = SAFE_PADDING + "px";
  viewport.style.overflow = "visible";

  const toTime = (iso) => {
    if (!iso) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
  };

  const escapeHtml = (s) => {
    if (s === null || s === undefined) return "";
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  };

  const ensureTodayMarker = () => {
    let marker = document.getElementById("todayMarker");
    if (marker) return marker;

    marker = document.createElement("div");
    marker.id = "todayMarker";
    marker.style.position = "absolute";
    marker.style.top = "0";
    marker.style.height = "100%";
    marker.style.width = "0";
    marker.style.pointerEvents = "none";
    marker.style.zIndex = "25";

    const vline = document.createElement("div");
    vline.style.position = "absolute";
    vline.style.top = "0";
    vline.style.bottom = "0";
    vline.style.left = "50%";
    vline.style.transform = "translateX(-50%)";
    vline.style.width = "2px";
    vline.style.backgroundImage =
      "repeating-linear-gradient(to bottom, #ef4444 0 6px, transparent 6px 12px)";
    vline.style.opacity = "0.9";

    const badge = document.createElement("div");
    badge.textContent = "HOJE";
    badge.style.position = "absolute";
    badge.style.top = "-8px";
    badge.style.left = "50%";
    badge.style.transform = "translateX(-50%)";
    badge.style.backgroundColor = "#ef4444";
    badge.style.color = "#ffffff";
    badge.style.fontSize = "9px";
    badge.style.fontWeight = "800";
    badge.style.padding = "1px 5px";
    badge.style.borderRadius = "3px";
    badge.style.letterSpacing = "0.5px";
    badge.style.boxShadow = "0 2px 4px rgba(0,0,0,0.15)";

    marker.appendChild(vline);
    marker.appendChild(badge);
    viewport.appendChild(marker);
    return marker;
  };

  container.innerHTML = REPORT.timeline.map(item => {
    const isTop = item.side === "top";
    const tip = item.tooltip ? escapeHtml(item.tooltip) : "";

    const boxHtml = (item.boxType === "dark")
      ? `<div class="bg-gray-900 text-white text-[10px] py-1 px-2 rounded leading-tight shadow-lg">
           ${escapeHtml(item.title)}<br><span class="opacity-70">${escapeHtml(item.subtitle)}</span>
         </div>`
      : `<div class="bg-white text-gray-900 text-[10px] py-1 px-2 rounded leading-tight border"
           style="border-color:${item.color}">
           ${escapeHtml(item.title)}<br>${escapeHtml(item.subtitle)}
         </div>`;

    return `
      <div class="relative flex flex-col items-center group w-24" data-iso="${item.iso || ""}">
        ${isTop ? `
          <div class="mb-4 text-center transform -translate-y-2">
            <span class="block text-xs font-bold mb-1" style="color:${item.color}">${escapeHtml(item.date)}</span>
            ${boxHtml}
          </div>
        ` : `<div class="h-1/2"></div>`}

        <div class="timeline-dot w-4 h-4 rounded-full bg-white border-4"
             style="border-color:${item.color}"></div>

        ${!isTop ? `
          <div class="mt-4 text-center transform translate-y-2">
            <span class="block text-xs font-bold mb-1" style="color:${item.color}">${escapeHtml(item.date)}</span>
            ${boxHtml}
          </div>
        ` : `<div class="h-1/2"></div>`}

        ${item.tooltip ? `
          <div class="pointer-events-none absolute left-1/2 top-0 -translate-x-1/2 -translate-y-3
                      opacity-0 group-hover:opacity-100 transition-opacity duration-150 z-50"
               style="min-width:220px; max-width:320px;">
            <div class="bg-black text-white text-[11px] leading-snug px-3 py-2 rounded-md shadow-lg">
              ${tip}
            </div>
            <div class="mx-auto w-0 h-0"
                 style="border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #000;"></div>
          </div>
        ` : ``}
      </div>
    `;
  }).join("");

  const applyScale = () => {
    container.style.transform = "scale(1)";
    container.style.transformOrigin = "left center";
    line.style.transform = "scaleX(1)";
    line.style.transformOrigin = "left center";

    const usableWidth = viewport.clientWidth - (SAFE_PADDING * 2);
    const contentWidth = container.scrollWidth;
    const scale = (contentWidth > usableWidth) ? (usableWidth / contentWidth) : 1;

    container.style.transform = `scale(${scale})`;

    line.style.width = contentWidth + "px";
    line.style.transform = `scaleX(${scale})`;
    line.style.left = SAFE_PADDING + "px"; 

    const marker = ensureTodayMarker();

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

    const viewportRect = viewport.getBoundingClientRect();
    const borderLeft = parseFloat(window.getComputedStyle(viewport).borderLeftWidth) || 0;

    const nodes = Array.from(container.querySelectorAll('[data-iso]'))
      .map(el => {
        const iso = el.getAttribute('data-iso');
        const t = toTime(iso);
        const dot = el.querySelector('.timeline-dot');
        if (!dot || t === null) return null;

        const r = dot.getBoundingClientRect();
        const xCenter = (r.left + r.width / 2) - (viewportRect.left + borderLeft);
        return { t, x: xCenter };
      })
      .filter(Boolean)
      .sort((a, b) => a.t - b.t);

    if (nodes.length < 2) { marker.style.display = "none"; return; }
    if (today < nodes[0].t || today > nodes[nodes.length - 1].t) { marker.style.display = "none"; return; }

    let i = 0;
    while (i < nodes.length - 2 && today > nodes[i + 1].t) i++;

    const a = nodes[i];
    const b = nodes[i + 1];

    const ratio = (today - a.t) / (b.t - a.t);
    const x = a.x + ratio * (b.x - a.x);

    marker.style.display = "block";
    marker.style.left = `${x}px`;
  };

  window.addEventListener("load", applyScale);
  window.addEventListener("resize", applyScale);
  setTimeout(applyScale, 100);
})();
</script>

<script>
(function () {
  if (!window.REPORT || !Array.isArray(REPORT.datesGates)) return;

  const root = document.getElementById("datesGatesRoot");
  const container = document.getElementById("datesGatesContainer");
  const line = document.getElementById("datesGatesLine");
  if (!root || !container || !line) return;

  const esc = (s) => String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  const toTime = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]).getTime(); 
  };

  const todayLocal = (() => {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  })();

  const pickTodayIndex = (items) => {
    const pts = items
      .map((x, idx) => ({ t: toTime(x.iso), idx }))
      .filter(x => x.t !== null)
      .sort((a,b) => a.t - b.t);

    if (pts.length === 0) return -1;

    const min = pts[0].t;
    const max = pts[pts.length - 1].t;
    if (todayLocal < min || todayLocal > max) return -1;

    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      if (todayLocal >= a.t && todayLocal <= b.t) {
        const da = Math.abs(todayLocal - a.t);
        const db = Math.abs(b.t - todayLocal);
        return (da <= db) ? a.idx : b.idx;
      }
    }
    return pts[pts.length - 1].idx;
  };

  const todayIdx = pickTodayIndex(REPORT.datesGates);

  if (!document.getElementById("datesGatesDynamicStyle")) {
    const st = document.createElement("style");
    st.id = "datesGatesDynamicStyle";
    st.textContent = `
      .dg-card { max-width: 100%; }
      .dg-text { overflow-wrap: anywhere; word-break: break-word; hyphens: auto; }
      .dg-list li { overflow-wrap: anywhere; word-break: break-word; }
    `;
    document.head.appendChild(st);
  }

  const renderCard = (item, isToday) => {
    const side = (item.side === "right") ? "right" : "left";
    const sections = Array.isArray(item.sections) ? item.sections : [];

    const tagHtml = (sec) => {
      const bg = sec?.tag?.bg || "#111";
      const fg = sec?.tag?.fg || "#fff";
      const text = esc(sec?.tag?.text || "");
      return `<span class="season-tag" style="background:${bg}; color:${fg}">${text}</span>`;
    };

    const itemsHtml = (sec) => {
      const list = Array.isArray(sec.items) ? sec.items : [];
      return `
        <ul class="dg-list text-xs text-gray-700 leading-relaxed font-medium dg-text">
          ${list.map(x => `<li>• ${esc(x)}</li>`).join("")}
        </ul>
      `;
    };

    const contentCommon = `
      <div class="inline-block bg-black text-white text-xs font-bold px-3 py-1 rounded-full mb-3">${esc(item.label)}</div>
      ${sections.map(sec => `
        <div class="mb-3 last:mb-0">
          ${tagHtml(sec)}
          ${itemsHtml(sec)}
        </div>
      `).join("")}
    `;

    const leftBlock = `
      <div class="w-[45%] flex justify-end">
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-100 w-full text-right hover:shadow-md transition-shadow dg-card">
          ${contentCommon}
        </div>
      </div>
    `;

    const rightBlock = `
      <div class="w-[45%] flex justify-start">
        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-100 w-full text-left hover:shadow-md transition-shadow dg-card">
          ${contentCommon}
        </div>
      </div>
    `;

    const centerDot = `
      <div class="w-[10%] flex justify-center items-center relative">
        <div class="w-3 h-3 rounded-full border-2 border-white z-10"
             style="background:${isToday ? "#E97132" : "#9ca3af"}"></div>
      </div>
    `;

    if (side === "left") {
      return `
        <div class="flex justify-between w-full mb-6 dates-item">
          ${leftBlock}
          ${centerDot}
          <div class="w-[45%]"></div>
        </div>
      `;
    } else {
      return `
        <div class="flex justify-between w-full mb-6 dates-item">
          <div class="w-[45%]"></div>
          ${centerDot}
          ${rightBlock}
        </div>
      `;
    }
  };

  container.innerHTML = REPORT.datesGates
    .map((item, idx) => renderCard(item, idx === todayIdx))
    .join("");
})();
</script>

</body>
</html>
