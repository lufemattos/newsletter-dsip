<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter DS&IP | Just Track It</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #111;
        }
        .nike-orange { color: #E97132; }
        .bg-nike-orange { background-color: #E97132; }
        .border-nike-orange { border-color: #E97132; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .timeline-node { position: relative; z-index: 10; }
        .horizontal-timeline-container { display: flex; justify-content: space-between; align-items: center; width: 100%; position: relative; }
        .season-tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; color: white; font-size: 10px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
        
        /* Ajuste para garantir que o PDF não corte o conteúdo lateral */
        @media print {
            .no-export { display: none !important; }
        }
    </style>
</head>
<body class="antialiased min-h-screen p-4 md:p-8">

    <div id="newsletter" class="max-w-6xl mx-auto bg-white shadow-xl overflow-hidden rounded-sm border border-gray-200">

        <div class="bg-black text-white p-6 flex justify-between items-center border-b-4 border-[#E97132]">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter uppercase">Checkpoint</h1>
                <h2 class="text-xl font-light text-gray-300 tracking-widest">DS<span class="text-[#E97132]">&</span>IP</h2>
            </div>
            <div class="text-right">
                <p class="text-sm font-bold text-gray-400 uppercase tracking-wider">Demand | Supply | Inventory</p>
                <p class="text-xs text-gray-500 mt-1">Updates Mensais</p>
            </div>
        </div>

        <section class="mb-8">
            <div class="bg-gray-900 text-white py-4 px-8 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-40 h-40 bg-[#E97132] opacity-5 rounded-full transform translate-x-10 -translate-y-10"></div>
                
                <div class="relative z-10 flex items-center justify-between gap-4 flex-wrap">
                    <h2 class="text-3xl font-black italic tracking-wide uppercase text-white">
                        JUST TRACK IT!
                    </h2>
                    
                    <div class="flex gap-2 no-export flex-wrap">
                        <a href="kpi.html"
                           class="inline-flex items-center bg-[#E97132] text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors border border-[#E97132]">
                           📊 KPIs
                        </a>

                        <a href="code.html"
                           class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">
                           CODE
                        </a>
                        
                        <a href="organograma.html"
                           class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">
                           ORGANOGRAMA
                        </a>
                        
                        <button id="exportPdfBtn"
                          class="inline-flex items-center border border-gray-400 text-gray-200 px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-gray-200 hover:text-black transition-colors">
                            Exportar PDF
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-8 bg-white border-b border-gray-100">
                <div class="w-full">
                    <table class="w-full text-left border-collapse">
                        <tbody id="justTrackItBody" class="text-sm md:text-base text-gray-800 font-medium">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="py-10 bg-white border-t border-b border-gray-100 overflow-visible">
            <h3 class="text-center text-2xl font-extrabold uppercase mb-12 italic">SP27 – Calendário de Compras</h3>
            <div class="relative w-full px-4 overflow-visible pb-8">
                <div id="timelineLine" class="absolute top-1/2 left-0 h-1 bg-gray-200 transform -translate-y-1/2 z-0"></div>
                <div id="timelineViewport" class="relative z-10 px-4 h-48">
                    <div id="timelineContainer" class="flex justify-between items-center h-48" style="transform-origin: left center;"></div>
                </div>
            </div>
        </section>

        <section class="p-8 bg-gray-50 border-t border-gray-200">
          <h3 class="text-2xl font-black uppercase tracking-tight text-center mb-12">Dates & Gates</h3>
          <div id="datesGatesRoot" class="relative max-w-4xl mx-auto">
            <div id="datesGatesLine" class="absolute left-1/2 top-4 bottom-4 w-px bg-gray-300 transform -translate-x-1/2"></div>
            <div id="datesGatesContainer"></div>
          </div>
        </section>

        <footer class="bg-black text-white py-6 text-center border-t-4 border-[#E97132]">
            <p class="text-sm font-light text-gray-400">Newsletter Confidencial | Uso Interno</p>
            <p class="text-xs text-[#E97132] font-bold mt-1 tracking-widest uppercase">Just Do It.</p>
        </footer>

    </div>

    <script src="data.js"></script>
    
    <script>
      (function () {
        if (!window.REPORT || !Array.isArray(REPORT.justTrackIt)) return;
        const tbody = document.getElementById("justTrackItBody");
        if (!tbody) return;
        tbody.innerHTML = REPORT.justTrackIt.map((it) => {
          if (it.accent) {
            return `
            <tr class="border-b border-gray-100 group hover:bg-gray-50 transition-colors">
              <td class="py-4 pl-4 border-l-4 border-[#E97132]">
                <span class="font-bold text-black block md:inline">${it.title || ""}</span> 
                <span class="text-gray-700">${it.text || ""}</span>
                ${it.check ? '<span class="ml-2 inline-flex items-center justify-center w-5 h-5 rounded-full bg-green-600 text-white text-[10px] font-bold">✓</span>' : ""}
              </td>
            </tr>`;
          }
          return `
            <tr class="border-b border-gray-100 group hover:bg-gray-50 transition-colors">
              <td class="py-4 pl-4 border-l-4 border-gray-200 group-hover:border-gray-400 transition-colors">
                <span class="font-bold text-black">${it.date || ""}</span> – ${it.text || ""}
                ${it.warn ? '<span class="text-lg ml-1">⚠️</span>' : ""}
              </td>
            </tr>`;
        }).join("");
      })();
    </script>

    <script>
    (function () {
      if (!window.REPORT || !Array.isArray(REPORT.timeline)) return;
      const viewport = document.getElementById("timelineViewport");
      const container = document.getElementById("timelineContainer");
      const line = document.getElementById("timelineLine");
      if (!viewport || !container || !line) return;

      const SAFE_PADDING = 50; 
      viewport.style.paddingLeft = SAFE_PADDING + "px";
      viewport.style.paddingRight = SAFE_PADDING + "px";
      viewport.style.overflow = "visible";

      const toTime = (iso) => {
        if (!iso) return null;
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
        if (!m) return null;
        return new Date(+m[1], +m[2] - 1, +m[3]).getTime();
      };

      const escapeHtml = (s) => String(s ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");

      const ensureTodayMarker = () => {
        let marker = document.getElementById("todayMarker");
        if (marker) return marker;
        marker = document.createElement("div");
        marker.id = "todayMarker";
        marker.style.position = "absolute";
        marker.style.top = "0"; marker.style.height = "100%"; marker.style.width = "0";
        marker.style.pointerEvents = "none"; marker.style.zIndex = "25";
        const vline = document.createElement("div");
        vline.style.position = "absolute"; vline.style.top = "0"; vline.style.bottom = "0"; vline.style.left = "50%";
        vline.style.transform = "translateX(-50%)"; vline.style.width = "2px";
        vline.style.backgroundImage = "repeating-linear-gradient(to bottom, #ef4444 0 6px, transparent 6px 12px)";
        marker.appendChild(vline);
        viewport.appendChild(marker);
        return marker;
      };

      container.innerHTML = REPORT.timeline.map(item => {
        const isTop = item.side === "top";
        const boxHtml = (item.boxType === "dark")
          ? `<div class="bg-gray-900 text-white text-[10px] py-1 px-2 rounded leading-tight shadow-lg border border-gray-700">${escapeHtml(item.title)}<br><span class="opacity-70">${escapeHtml(item.subtitle)}</span></div>`
          : `<div class="bg-white text-gray-900 text-[10px] py-1 px-2 rounded leading-tight border shadow-sm" style="border-color:${item.color}">${escapeHtml(item.title)}<br>${escapeHtml(item.subtitle)}</div>`;

        return `
          <div class="relative flex flex-col items-center group w-24" data-iso="${item.iso || ""}">
            ${isTop ? `<div class="mb-4 text-center transform -translate-y-2"><span class="block text-xs font-bold mb-1" style="color:${item.color}">${escapeHtml(item.date)}</span>${boxHtml}</div>` : `<div class="h-1/2"></div>`}
            <div class="timeline-dot w-4 h-4 rounded-full bg-white border-4" style="border-color:${item.color}"></div>
            ${!isTop ? `<div class="mt-4 text-center transform translate-y-2"><span class="block text-xs font-bold mb-1" style="color:${item.color}">${escapeHtml(item.date)}</span>${boxHtml}</div>` : `<div class="h-1/2"></div>`}
          </div>`;
      }).join("");

      const applyScale = () => {
        const usableWidth = viewport.clientWidth - (SAFE_PADDING * 2);
        const contentWidth = container.scrollWidth;
        const scale = (contentWidth > usableWidth) ? (usableWidth / contentWidth) : 1;
        container.style.transform = `scale(${scale})`;
        line.style.width = contentWidth + "px";
        line.style.transform = `scaleX(${scale})`;
        line.style.left = SAFE_PADDING + "px"; 

        const marker = ensureTodayMarker();
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const viewportRect = viewport.getBoundingClientRect();
        const nodes = Array.from(container.querySelectorAll('[data-iso]')).map(el => {
            const t = toTime(el.getAttribute('data-iso'));
            const dot = el.querySelector('.timeline-dot');
            if (!dot || t === null) return null;
            const r = dot.getBoundingClientRect();
            return { t, x: (r.left - viewportRect.left) + (r.width / 2) };
        }).filter(Boolean).sort((a, b) => a.t - b.t);

        if (nodes.length < 2 || today < nodes[0].t || today > nodes[nodes.length - 1].t) {
            marker.style.display = "none";
        } else {
            let i = 0; while (i < nodes.length - 2 && today > nodes[i + 1].t) i++;
            const a = nodes[i], b = nodes[i + 1];
            const x = a.x + ((today - a.t) / (b.t - a.t)) * (b.x - a.x);
            marker.style.display = "block";
            marker.style.left = `${x}px`;
        }
      };
      applyScale();
      window.addEventListener("resize", applyScale);
    })();
    </script>

    <script>
    (function () {
      if (!window.REPORT || !Array.isArray(REPORT.datesGates)) return;
      const container = document.getElementById("datesGatesContainer");
      if (!container) return;

      const esc = (s) => String(s ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const todayLocal = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()).getTime();
      const toTime = (iso) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
        return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : null;
      };

      const todayIdx = REPORT.datesGates.findIndex((x, idx, arr) => {
        const t = toTime(x.iso);
        if (!t) return false;
        const next = arr[idx+1] ? toTime(arr[idx+1].iso) : Infinity;
        return todayLocal >= t && todayLocal < next;
      });

      container.innerHTML = REPORT.datesGates.map((item, idx) => {
        const isToday = idx === todayIdx;
        const side = item.side === "right" ? "right" : "left";
        const sections = item.sections || [];
        
        const content = `
          <div class="inline-block bg-black text-white text-[10px] font-bold px-3 py-1 rounded-full mb-3 uppercase">${esc(item.label)}</div>
          ${sections.map(sec => `
            <div class="mb-3 last:mb-0">
              <span class="season-tag" style="background:${sec.tag?.bg}; color:${sec.tag?.fg}">${esc(sec.tag?.text)}</span>
              <ul class="text-xs text-gray-700 leading-relaxed font-medium">
                ${(sec.items || []).filter(x => x.trim() !== "").map(x => `<li>• ${esc(x)}</li>`).join("")}
              </ul>
            </div>`).join("")}
        `;

        const cardClass = "bg-white p-5 rounded-lg shadow-sm border border-gray-100 w-full hover:shadow-md transition-shadow";
        const dotColor = isToday ? "#E97132" : "#9ca3af";
        const dotStyle = isToday ? "transform: scale(1.5); box-shadow: 0 0 10px rgba(233,113,50,0.5);" : "";

        return `
          <div class="flex justify-between w-full mb-8 relative">
            <div class="w-[45%] ${side === 'left' ? '' : 'invisible'}">
                <div class="${cardClass} text-right">${content}</div>
            </div>
            <div class="w-[10%] flex justify-center items-center relative z-10">
                <div class="w-3 h-3 rounded-full border-2 border-white transition-all" style="background:${dotColor}; ${dotStyle}"></div>
            </div>
            <div class="w-[45%] ${side === 'right' ? '' : 'invisible'}">
                <div class="${cardClass} text-left">${content}</div>
            </div>
          </div>`;
      }).join("");
    })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
    (function () {
      const btn = document.getElementById("exportPdfBtn");
      const target = document.getElementById("newsletter");
      if (!btn || !target) return;

      btn.addEventListener("click", async function () {
        btn.textContent = "Gerando..."; btn.disabled = true;
        const hidden = [];
        document.querySelectorAll(".no-export").forEach(el => {
          hidden.push({ el, display: el.style.display });
          el.style.display = "none";
        });

        const opt = {
          margin: [5, 5],
          filename: `Newsletter_DSIP_${(REPORT.lastUpdate || 'update').replace(/\W/g,'_')}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
          await html2pdf().set(opt).from(target).save();
        } finally {
          hidden.forEach(x => x.el.style.display = x.display);
          btn.textContent = "Exportar PDF"; btn.disabled = false;
        }
      });
    })();
    </script>
</body>
</html>
