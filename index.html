<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter DS&IP | Just Track It</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #111; }
        .nike-orange { color: #E97132; }
        .bg-nike-orange { background-color: #E97132; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .season-tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; color: white; font-size: 10px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
    </style>
</head>
<body class="antialiased min-h-screen p-4 md:p-8">

    <div id="newsletter" class="max-w-6xl mx-auto bg-white shadow-xl overflow-hidden rounded-sm border border-gray-200">

        <div class="bg-black text-white p-6 flex justify-between items-center border-b-4 border-[#E97132]">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter uppercase">Checkpoint</h1>
                <h2 class="text-xl font-light text-gray-300 tracking-widest">DS<span class="text-[#E97132]">&</span>IP</h2>
            </div>
            <div class="text-right">
                <p class="text-sm font-bold text-gray-400 uppercase tracking-wider">Demand | Supply | Inventory</p>
                <p class="text-xs text-gray-500 mt-1">Updates Mensais</p>
            </div>
        </div>

        <section class="mb-8">
            <div class="bg-gray-900 text-white py-4 px-8 shadow-sm relative overflow-hidden">
                <div class="absolute top-0 right-0 w-40 h-40 bg-[#E97132] opacity-5 rounded-full transform translate-x-10 -translate-y-10"></div>
                <div class="relative z-10 flex items-center justify-between gap-4 flex-wrap">
                    <h2 class="text-3xl font-black italic tracking-wide uppercase text-white">JUST TRACK IT!</h2>
                    <div class="flex gap-2 no-export flex-wrap">
                        <a href="kpi.html" class="inline-flex items-center bg-[#E97132] text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors border border-[#E97132]">
                           📊 KPIs
                        </a>
                        <a href="code.html" class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">CODE</a>
                        <a href="organograma.html" class="inline-flex items-center border border-white text-white px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-white hover:text-black transition-colors">ORGANOGRAMA</a>
                        <button id="exportPdfBtn" class="inline-flex items-center border border-gray-400 text-gray-200 px-4 py-2 text-sm font-bold uppercase tracking-wider hover:bg-gray-200 hover:text-black transition-colors">Exportar PDF</button>
                    </div>
                </div>
            </div>

            <div class="p-8 bg-white border-b border-gray-100">
                <table class="w-full text-left border-collapse">
                    <tbody id="justTrackItBody" class="text-sm md:text-base text-gray-800 font-medium"></tbody>
                </table>
            </div>
        </section>

        <section class="py-10 bg-white border-t border-b border-gray-100 overflow-visible">
            <h3 class="text-center text-2xl font-extrabold uppercase mb-12 italic">SP27 – Calendário de Compras</h3>
            <div class="relative w-full px-4 overflow-visible pb-8">
                <div id="timelineLine" class="absolute top-1/2 left-0 h-1 bg-gray-200 transform -translate-y-1/2 z-0"></div>
                <div id="timelineViewport" class="relative z-10 px-4 h-48">
                    <div id="timelineContainer" class="flex justify-between items-center h-48" style="transform-origin: left center;"></div>
                </div>
            </div>
        </section>

        <section class="p-8 bg-gray-50 border-t border-gray-200">
          <h3 class="text-2xl font-black uppercase tracking-tight text-center mb-12">Dates & Gates</h3>
          <div id="datesGatesRoot" class="relative max-w-4xl mx-auto">
            <div id="datesGatesLine" class="absolute left-1/2 top-4 bottom-4 w-px bg-gray-300 transform -translate-x-1/2"></div>
            <div id="datesGatesContainer"></div>
          </div>
        </section>

        <footer class="bg-black text-white py-6 text-center border-t-4 border-[#E97132]">
            <p class="text-sm font-light text-gray-400">Newsletter Confidencial | Uso Interno</p>
            <p class="text-xs text-[#E97132] font-bold mt-1 tracking-widest uppercase">Just Do It.</p>
        </footer>
    </div>

    <script src="data.js"></script>
    <script>
      /* Render Just Track It */
      (function(){
        if(!window.REPORT || !REPORT.justTrackIt) return;
        document.getElementById("justTrackItBody").innerHTML = REPORT.justTrackIt.map(it => `
          <tr class="border-b border-gray-100 group hover:bg-gray-50 transition-colors">
            <td class="py-4 pl-4 border-l-4 ${it.accent ? 'border-[#E97132]' : 'border-gray-200'}">
              <span class="font-bold text-black">${it.title || it.date || ""}</span> ${it.text || ""}
              ${it.check ? '<span class="ml-2 inline-flex items-center justify-center w-5 h-5 rounded-full bg-green-600 text-white text-[10px]">✓</span>' : ""}
              ${it.warn ? '⚠️' : ""}
            </td>
          </tr>`).join("");
      })();

      /* Render Timeline Horizontal */
      (function(){
        if(!window.REPORT || !REPORT.timeline) return;
        const container = document.getElementById("timelineContainer");
        container.innerHTML = REPORT.timeline.map(item => {
          const isTop = item.side === "top";
          return `
            <div class="relative flex flex-col items-center w-24" data-iso="${item.iso}">
              ${isTop ? `<div class="mb-4 text-center transform -translate-y-2"><span class="block text-xs font-bold" style="color:${item.color}">${item.date}</span><div class="bg-white text-[10px] p-1 rounded border shadow-sm" style="border-color:${item.color}">${item.title}</div></div>` : '<div class="h-1/2"></div>'}
              <div class="w-4 h-4 rounded-full bg-white border-4" style="border-color:${item.color}"></div>
              ${!isTop ? `<div class="mt-4 text-center transform translate-y-2"><span class="block text-xs font-bold" style="color:${item.color}">${item.date}</span><div class="bg-white text-[10px] p-1 rounded border shadow-sm" style="border-color:${item.color}">${item.title}</div></div>` : '<div class="h-1/2"></div>'}
            </div>`;
        }).join("");
      })();

      /* Render Dates & Gates */
      (function(){
        if(!window.REPORT || !REPORT.datesGates) return;
        document.getElementById("datesGatesContainer").innerHTML = REPORT.datesGates.map(item => `
          <div class="flex justify-between w-full mb-8 relative">
            <div class="w-[45%] ${item.side==='left'?'':'invisible'} text-right bg-white p-4 rounded shadow-sm border">
                <div class="text-xs font-bold bg-black text-white px-2 py-1 rounded-full inline-block mb-2">${item.label}</div>
                ${item.sections.map(s => `<div class="mb-2"><span class="season-tag" style="background:${s.tag.bg}">${s.tag.text}</span><ul class="text-[11px]">${s.items.map(i=>`<li>• ${i}</li>`).join("")}</ul></div>`).join("")}
            </div>
            <div class="w-[10%] flex justify-center items-center"><div class="w-3 h-3 rounded-full bg-gray-400 border-2 border-white"></div></div>
            <div class="w-[45%] ${item.side==='right'?'':'invisible'} text-left bg-white p-4 rounded shadow-sm border">
                <div class="text-xs font-bold bg-black text-white px-2 py-1 rounded-full inline-block mb-2">${item.label}</div>
                ${item.sections.map(s => `<div class="mb-2"><span class="season-tag" style="background:${s.tag.bg}">${s.tag.text}</span><ul class="text-[11px]">${s.items.map(i=>`<li>• ${i}</li>`).join("")}</ul></div>`).join("")}
            </div>
          </div>`).join("");
      })();
    </script>
</body>
</html>
