<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE | DS&IP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111; }
        .code-card { background: white; border-radius: 4px; border: 1px solid #e5e7eb; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.2s ease-in-out; }
        .code-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .btn-link { background-color: #E97132; color: #fff; padding: 0.75rem 1.5rem; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; border-radius: 2px; transition: all 0.2s; tracking-wider }
        .btn-link:hover { background-color: #111; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-black text-white p-6 flex justify-between items-center border-b-4 border-[#E97132] mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter uppercase">CODE</h1>
                <h2 class="text-xl font-light text-gray-300 tracking-widest">DS<span class="text-[#E97132]">&</span>IP</h2>
            </div>
            <a href="index.html" class="border border-white px-4 py-2 text-xs font-bold uppercase hover:bg-white hover:text-black transition">← Voltar</a>
        </div>

        <div class="bg-white border border-gray-200 p-6 rounded-sm mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm">
            <div>
                <h3 class="text-lg font-bold text-gray-900 uppercase">Ferramenta Oficial CODE</h3>
                <p class="text-sm text-gray-500">Clique ao lado para acessar o link direto de acompanhamento das demandas.</p>
            </div>
            <a href="https://docs.google.com/spreadsheets/d/1auiBMP4k7uo18Qvu4C_Ec9tneDDZwLYB/edit?gid=1389055494#gid=1389055494" target="_blank" class="btn-link inline-flex items-center gap-2">
                Acessar Link Atualizado ↗
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="code-card">
                <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
                    <h4 class="font-extrabold uppercase tracking-tight text-sm">Visão Julho</h4>
                    <span class="text-xs font-bold text-[#E97132]">Q3</span>
                </div>
                <div class="p-2 bg-gray-50 border-b border-gray-100 flex justify-center items-center aspect-[4/3] overflow-hidden">
                    <img src="CODEJUL.png" alt="Visão Julho" class="max-w-full max-h-full object-contain rounded-sm" onerror="this.onerror=null; this.src='https://placehold.co/600x450?text=CODEJUL+Pendente';">
                </div>
                <div class="p-4 text-center">
                    <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Arquivo: CODEJUL.png</p>
                </div>
            </div>

            <div class="code-card">
                <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
                    <h4 class="font-extrabold uppercase tracking-tight text-sm">Visão Agosto</h4>
                    <span class="text-xs font-bold text-[#E97132]">Q3</span>
                </div>
                <div class="p-2 bg-gray-50 border-b border-gray-100 flex justify-center items-center aspect-[4/3] overflow-hidden">
                    <img src="CODEAGO.png" alt="Visão Agosto" class="max-w-full max-h-full object-contain rounded-sm" onerror="this.onerror=null; this.src='https://placehold.co/600x450?text=CODEAGO+Pendente';">
                </div>
                <div class="p-4 text-center">
                    <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Arquivo: CODEAGO.png</p>
                </div>
            </div>

            <div class="code-card">
                <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
                    <h4 class="font-extrabold uppercase tracking-tight text-sm">Visão Setembro</h4>
                    <span class="text-xs font-bold text-[#E97132]">Q3</span>
                </div>
                <div class="p-2 bg-gray-50 border-b border-gray-100 flex justify-center items-center aspect-[4/3] overflow-hidden">
                    <img src="CODESET.png" alt="Visão Setembro" class="max-w-full max-h-full object-contain rounded-sm" onerror="this.onerror=null; this.src='https://placehold.co/600x450?text=CODESET+Pendente';">
                </div>
                <div class="p-4 text-center">
                    <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Arquivo: CODESET.png</p>
                </div>
            </div>

        </div>

        <footer class="text-center py-12 mt-4">
            <p class="text-xs text-gray-400 uppercase font-bold tracking-widest">Confidencial | Uso Interno</p>
        </footer>
    </div>

</body>
</html>
